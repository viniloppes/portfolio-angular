<div class="space-y-2 text-center dark:text-gray-900 px-4">
    <div class=" space-y-5 mt-3">
        <p class="font-medium  text-5xl">Full Stack Developer</p>
        <p class="text-sm font-semibold dark:text-gray-400">Software Engineer | Angular, .NET & C# | 6y Exp. | Full
            Stack & Game Dev</p>

    </div>

</div>
<div class="container mx-auto px-4">
    <!-- Grid principal: 1 coluna mobile, 3 colunas desktop -->
    <div class="grid grid-cols-1 md:grid-cols-3 mt-5 border-t border-black">

        <!-- Coluna 01: Projects -->
        <div class="flex flex-col border-b md:border-b-0 md:border-r border-black">
            <p class="text-xl font-bold mb-4">Projects</p>
            <p-toast />
            <!-- <div class="h-75 full overflow-y-auto"> -->

            <p-scrollpanel [style]="{ width: '100%', height: '300px' }">
                <ul class="m-0 list-none  rounded flex flex-col gap-2 w-full ">
                    <li *ngFor="let user of users"
                        class="p-2 hover:bg-emphasis rounded border border-transparent transition-all duration-200 flex items-center justify-content-between"
                        [ngClass]="{ 'border-primary': selectedId === user.id }"
                        (contextmenu)="onContextMenu($event, user)">
                        <a [href]="user.href" target="_blank" class="w-full">
                            <div class="flex flex-1 items-center gap-2">

                                <span class="font-normal">{{ user.name }}</span>
                            </div>

                        </a>

                    </li>
                </ul>
            </p-scrollpanel>
            <!-- </div> -->

        </div>

        <!-- Coluna 02: Work Experience & OpenSource -->
        <div class="flex flex-col border-b md:border-b-0 md:border-r border-black">
            <div class="md:p-4 py-4 border-b border-black flex-1">
                <p class="font-bold">Work Experience</p>
                <div class="mt-2">02 - Content</div>
            </div>
            <div class="md:p-4 py-4 flex-1">
                <p class="font-bold">OpenSource Work</p>
                <div>03 - Content</div>
            </div>
        </div>

        <!-- Coluna 03: Education -->
        <div class="flex flex-col md:p-4 py-4">
            <p class="font-bold">Education</p>
            <div class="mt-2">04 - Content</div>
        </div>

    </div>

    <!-- Seção Inferior: Reviews -->
    <div class="border-t border-black md:p-4 py-4">
        <p class="font-bold mb-4">Reviews from my Teachers</p>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="border border-black rounded-3xl p-6">Review 1</div>
            <div class="border border-black rounded-3xl p-6">Review 2</div>
            <div class="border border-black rounded-3xl p-6">Review 3</div>
        </div>
    </div>
</div>
